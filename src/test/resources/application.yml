# Reemplaza a src/main/resources/application.yml durante las pruebas (no se mezcla con él):
# toda propiedad que necesite una prueba se repite aquí. Sin Config Server.
#
# Las pruebas @SpringBootTest de persistencia necesitan Mongo local como replica set de un nodo
# (--replSet rs0, el del docker-compose de bank-platform): la transacción de MongoUnitOfWorkAdapter
# no funciona contra un mongod standalone.
spring:
  application:
    name: credit-service
  cloud:
    config:
      enabled: false
  data:
    mongodb:
      uri: mongodb://localhost:27017/bank_credit_test?directConnection=true
      auto-index-creation: false

bank:
  zone: America/Lima
  clients:
    customer-service:
      base-url: http://localhost:9999/api/v1
    transaction-service:
      base-url: http://localhost:9999/api/v1

# data-model §8. Los cron en "-" desactivan los procesos programados durante las pruebas (valor
# oficial de Spring): así ninguno corre en medio de una prueba de persistencia.
credit:
  demo-mode: false
  card:
    payment-term-days: 30
  overdue:
    cron: "-"
  recorder:
    pending-minutes: 2
    cron: "-"

resilience4j:
  circuitbreaker:
    instances:
      customer-service:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
      transaction-service:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      customer-service:
        timeout-duration: 2s
        cancel-running-future: true
      transaction-service:
        timeout-duration: 2s
        cancel-running-future: true
